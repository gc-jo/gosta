name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: supabase --version
      - uses: denoland/setup-deno@v2
      - run: supabase db start
      - run: supabase test db
      - run: deno test --allow-net=127.0.0.1:54322 --allow-env --allow-read --allow-sys supabase/tests-concurrency/
      - run: deno test --permit-no-files supabase/functions/
